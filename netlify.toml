# Netlify build settings. Netlify reads this file when the repository is
# imported, so nothing needs to be typed into the dashboard except the two
# Supabase variables (see README.md).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 needs Node 20.19+ or 22.12+.
  NODE_VERSION = "22"

# The single-page-app redirect (every path -> index.html, so React Router can
# pick the page) lives in public/_redirects, which Netlify reads on its own.

[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
